name: Build and push withdrawals-api to dev

run-name: Build and push withdrawals-api:dev to dev

on:
  workflow_dispatch:
# TODO: Uncomment once manual execution is no longer required
#  push:
#    branches:
#      - develop
#    paths-ignore:
#      - '.github/**'
#      - 'tests/**'
#      - '**.md'

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@c7b5b6c5d8013046347d728d748fa741eb214e28
    with:
      tag: dev
      registry: registry.dev.k8s-dev.org
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      image: team-si/withdrawals-api
      environment: dev
    secrets:
      registry_token: ${{ secrets.HARBOR_DEV_TOKEN }}
