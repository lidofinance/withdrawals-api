name: "[K8S] Build and push withdrawals-api to dev"

run-name: "[K8S] Build and push withdrawals-api:dev to dev"

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/**'
      - 'tests/**'
      - '**.md'

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@main
    with:
      target: dev
      harbor_project: team-si
      image: withdrawals-api
      # dockerfile: path/to/Dockerfile
    secrets: inherit
